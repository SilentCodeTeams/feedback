name: 功能建议 / Feature request
description: 提交新功能、改进或工作流建议。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue，并说明要解决的问题，而不只是功能名称。
        安全漏洞请勿在此公开提交，请发送至 SilentStudio@feedback.email.cn。
  - type: dropdown
    id: feedback_language
    attributes:
      label: 反馈语言 / Feedback language
      description: 选择你希望我们回复时使用的语言。
      options:
        - 简体中文
        - English
        - Español
        - Français
        - Deutsch
        - Русский
        - 日本語
        - 한국어
        - العربية
        - Português
        - Italiano
        - हिन्दी
        - ไทย
        - Tiếng Việt
        - Bahasa Indonesia
        - Türkçe
        - Nederlands
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: 项目 / Project
      description: 选择已登记项目；未列出请选“其他”并在下一项填写。
      options:
        - NetTool ζ
        - 其他 / Not listed
    validations:
      required: true
  - type: input
    id: project_other
    attributes:
      label: 其他项目 / Other project
      description: 如果上方选择“其他”，请填写项目名或 feedback 目录名；否则可留空。
      placeholder: 项目名或目录名
  - type: input
    id: version
    attributes:
      label: 版本或 commit / Version
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 当前哪里不方便，影响了什么场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已搜索过已有 issue。
          required: true
        - label: 我没有包含密钥、令牌或个人数据。
          required: true
