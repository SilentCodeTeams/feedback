name: 功能建议 / Feature request
description: 提交新功能、改进或工作流建议。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue，并说明要解决的问题，而不只是功能名称。
  - type: input
    id: project
    attributes:
      label: 项目 / Project
      description: 项目名或 feedback 目录名。
      placeholder: 项目名或目录名
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit / Version
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 当前哪里不方便，影响了什么场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已搜索过已有 issue。
          required: true
        - label: 我没有包含密钥、令牌或个人数据。
          required: true
