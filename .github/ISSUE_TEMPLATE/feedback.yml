name: 项目反馈
description: 提交 SilentCodeTeams 项目的缺陷、功能建议或使用问题。
title: "[项目] "
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请勿在此公开提交，请发送至 SilentStudio@feedback.email.cn。
        Do not report security vulnerabilities here. Email SilentStudio@feedback.email.cn.
  - type: input
    id: project
    attributes:
      label: 项目名称
      description: 请填写反馈针对的项目；已登记项目请使用其目录名。
      placeholder: 项目名称或目录名
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 类别
      description: 选择反馈类别。
      options:
        - bug
        - language
        - feature
        - question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请提供复现步骤、期望结果与实际结果。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、架构、协议与方向（如适用）。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 issue。
          required: true
        - label: 我没有包含密钥、令牌或个人数据。
          required: true
        - label: 这不是安全漏洞。
          required: true
