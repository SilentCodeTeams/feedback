name: 语言与翻译 / Language
description: 提交翻译、术语、本地化或语言支持问题。
title: "[Language] "
body:
  - type: markdown
    attributes:
      value: |
        请指明目标语言、位置和当前文本，便于核对。
        安全漏洞请勿在此公开提交，请发送至 SilentStudio@feedback.email.cn。
  - type: dropdown
    id: feedback_language
    attributes:
      label: 反馈语言 / Feedback language
      description: 选择你希望我们回复时使用的语言。
      options:
        - 简体中文
        - English
        - Español
        - Français
        - Deutsch
        - Русский
        - 日本語
        - 한국어
        - العربية
        - Português
        - Italiano
        - हिन्दी
        - ไทย
        - Tiếng Việt
        - Bahasa Indonesia
        - Türkçe
        - Nederlands
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: 项目 / Project
      description: 选择已登记项目；未列出请选“其他”并在下一项填写。
      options:
        - NetTool ζ
        - 其他 / Not listed
    validations:
      required: true
  - type: input
    id: project_other
    attributes:
      label: 其他项目 / Other project
      description: 如果上方选择“其他”，请填写项目名或 feedback 目录名；否则可留空。
      placeholder: 项目名或目录名
  - type: input
    id: language
    attributes:
      label: 目标语言 / Target language
      description: 例如 简体中文、English、日本語。
      placeholder: 简体中文
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 位置 / Location
      description: 文件、页面或字符串位置。
      placeholder: README.md 第 12 行
  - type: textarea
    id: current
    attributes:
      label: 当前文本 / Current text
  - type: textarea
    id: suggestion
    attributes:
      label: 建议文本 / Suggested text
      description: 请给出可直接替换的文本。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 说明 / Context
      description: 术语、语气或本地化背景。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已搜索过已有 issue。
          required: true
        - label: 我没有包含密钥、令牌或个人数据。
          required: true
