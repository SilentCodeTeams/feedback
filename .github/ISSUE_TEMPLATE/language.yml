name: 语言与翻译 / Language
description: 提交翻译、术语、本地化或语言支持问题。
title: "[Language] "
body:
  - type: markdown
    attributes:
      value: |
        请指明具体语言、位置和当前文本，便于核对。
  - type: input
    id: project
    attributes:
      label: 项目 / Project
      description: 项目名或 feedback 目录名。
      placeholder: 项目名或目录名
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: 语言 / Language
      description: 目标语言，例如 简体中文、English、日本語。
      placeholder: 简体中文
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 位置 / Location
      description: 文件、页面或字符串位置。
      placeholder: README.md 第 12 行
  - type: textarea
    id: current
    attributes:
      label: 当前文本 / Current text
  - type: textarea
    id: suggestion
    attributes:
      label: 建议文本 / Suggested text
      description: 请给出可直接替换的文本。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 说明 / Context
      description: 术语、语气或本地化背景。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已搜索过已有 issue。
          required: true
        - label: 我没有包含密钥、令牌或个人数据。
          required: true
